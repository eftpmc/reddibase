[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reddibase"
version = "0.1.0"
description = "Open-source identification model platform built on Reddit archives"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sentence-transformers>=3.0,<4",
    "faiss-cpu>=1.8",
    "transformers>=4.40,<5",
    "torch>=2.5,<2.6",
    "datasets>=2.19,<4",
    "accelerate>=1.1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"
