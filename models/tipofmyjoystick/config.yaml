name: tipofmyjoystick
display_name: Tip of My Joystick
description: Identify games from vague descriptions, sourced from r/tipofmyjoystick.
subreddit: tipofmyjoystick
hf_repo: eftpmc/tipofmyjoystick-identification
classifier_repo: eftpmc/reddibase-classifier

scraper:
  after: 0
  request_delay: 1.0

classifier:
  base_model: distilbert-base-uncased
  flair_strategy: any_flair_is_solved
  confidence_threshold: 0.8

identification_model:
  base_encoder: sentence-transformers/all-MiniLM-L6-v2
  top_k: 10

stats:
  confirmed_pairs: 174094